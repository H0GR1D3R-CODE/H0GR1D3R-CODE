<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Nebin Stanly</title>
  <desc id="d">BCA '28 at Christ University, Bengaluru. Full-stack, IoT and real-time projects, taken past the tutorial stage. A panda in a straw hat peeks over a snow drift while snow falls.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#13263A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#8ECAE6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8ECAE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF4F8"/>
      <stop offset="1" stop-color="#C9DDEA"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99A45"/>
      <stop offset="0.5" stop-color="#ECC273"/>
      <stop offset="1" stop-color="#C4933F"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF4F8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EEF4F8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>
  <style>
    .f { fill: #EEF4F8; animation: fall linear infinite; }
    @keyframes fall { to { transform: translate(var(--d), 400px); } }

    .tw { fill: #EEF4F8; opacity: 0.55; animation: twinkle ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: 0.08; } }

    .shoot { opacity: 0; animation: shoot 13s linear 3s infinite; }
    @keyframes shoot {
      0%   { opacity: 0; transform: translate(0, 0); }
      1%   { opacity: 1; }
      7%   { opacity: 0; transform: translate(-330px, 132px); }
      100% { opacity: 0; transform: translate(-330px, 132px); }
    }

    .ridge { animation: sway 16s ease-in-out infinite alternate; }
    @keyframes sway { to { transform: translateX(-26px); } }

    .up { animation: up 0.9s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } }
    .ch { animation: ch 0.5s ease-out backwards; }
    @keyframes ch { from { fill-opacity: 0; } }

    .rise { animation: rise 1.1s cubic-bezier(.3,1.5,.5,1) 1.5s backwards; }
    @keyframes rise { from { transform: translateY(150px); } }
    .peek { animation: peek 9s ease-in-out 4s infinite; }
    @keyframes peek {
      0%, 62%, 100% { transform: translateY(0); }
      72%, 90%      { transform: translateY(-9px); }
    }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s linear 3s infinite; }
    @keyframes blink {
      0%, 92%, 96%, 100% { transform: scaleY(1); }
      94%                { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-reduced-motion: reduce) { .f { transform: translate(0, calc(var(--d) * 4 + 150px)); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#sky)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <circle class="tw" cx="968" cy="27" r="0.9" style="animation-duration:3.3s;animation-delay:-3.1s"/><circle class="tw" cx="1067" cy="56" r="0.9" style="animation-duration:2.8s;animation-delay:-1.0s"/><circle class="tw" cx="1130" cy="79" r="0.9" style="animation-duration:5.4s;animation-delay:-4.6s"/><circle class="tw" cx="699" cy="146" r="0.9" style="animation-duration:4.1s;animation-delay:-3.7s"/><circle class="tw" cx="1102" cy="81" r="0.9" style="animation-duration:3.3s;animation-delay:-2.8s"/><circle class="tw" cx="1046" cy="58" r="1.4" style="animation-duration:3.9s;animation-delay:-3.3s"/><circle class="tw" cx="810" cy="125" r="1.4" style="animation-duration:5.3s;animation-delay:-2.4s"/><circle class="tw" cx="732" cy="155" r="1.1" style="animation-duration:3.2s;animation-delay:-0.3s"/><circle class="tw" cx="626" cy="117" r="0.9" style="animation-duration:5.1s;animation-delay:-2.7s"/><circle class="tw" cx="1164" cy="18" r="1.1" style="animation-duration:3.0s;animation-delay:-1.9s"/><circle class="tw" cx="777" cy="49" r="1.1" style="animation-duration:4.1s;animation-delay:-1.5s"/><circle class="tw" cx="775" cy="34" r="1.4" style="animation-duration:3.4s;animation-delay:-2.7s"/><circle class="tw" cx="587" cy="157" r="1.4" style="animation-duration:4.1s;animation-delay:-4.3s"/><circle class="tw" cx="983" cy="125" r="1.4" style="animation-duration:4.0s;animation-delay:-3.5s"/><circle class="tw" cx="961" cy="166" r="0.9" style="animation-duration:3.6s;animation-delay:-3.4s"/><circle class="tw" cx="908" cy="22" r="1.1" style="animation-duration:4.4s;animation-delay:-2.2s"/>
    <g class="shoot"><rect x="1090" y="34" width="120" height="1.8" rx="0.9" fill="url(#trail)" transform="rotate(-21.8 1090 34)"/></g>

    <!-- far ridge -->
    <path class="ridge" d="M-40 300 C 160 262, 330 318, 520 290 S 860 250, 1010 276 S 1150 300, 1240 280 V380 H-40 Z" fill="#1D3349" opacity="0.75"/>

    <g><circle class="f" cx="143" cy="-8" r="1.5" opacity="0.32" style="animation-duration:17.8s;animation-delay:-12.7s;--d:-14px"/><circle class="f" cx="558" cy="-8" r="2.2" opacity="0.71" style="animation-duration:10.7s;animation-delay:-1.5s;--d:-14px"/><circle class="f" cx="165" cy="-8" r="1.5" opacity="0.3" style="animation-duration:13.3s;animation-delay:-5.4s;--d:-26px"/><circle class="f" cx="1172" cy="-8" r="1.8" opacity="0.75" style="animation-duration:17.8s;animation-delay:-14.7s;--d:-14px"/><circle class="f" cx="608" cy="-8" r="3.2" opacity="0.38" style="animation-duration:12.3s;animation-delay:-9.8s;--d:34px"/><circle class="f" cx="812" cy="-8" r="1.5" opacity="0.6" style="animation-duration:13.3s;animation-delay:-12.4s;--d:10px"/><circle class="f" cx="317" cy="-8" r="2.6" opacity="0.57" style="animation-duration:12.5s;animation-delay:-11.4s;--d:-26px"/><circle class="f" cx="1056" cy="-8" r="1.5" opacity="0.46" style="animation-duration:15.5s;animation-delay:-0.5s;--d:22px"/><circle class="f" cx="455" cy="-8" r="1.8" opacity="0.61" style="animation-duration:19.4s;animation-delay:-7.5s;--d:34px"/><circle class="f" cx="216" cy="-8" r="1.5" opacity="0.48" style="animation-duration:14.7s;animation-delay:-8.6s;--d:34px"/><circle class="f" cx="47" cy="-8" r="1.5" opacity="0.62" style="animation-duration:11.5s;animation-delay:-11.0s;--d:10px"/><circle class="f" cx="909" cy="-8" r="2.2" opacity="0.65" style="animation-duration:9.6s;animation-delay:-7.8s;--d:-14px"/><circle class="f" cx="625" cy="-8" r="2.6" opacity="0.62" style="animation-duration:14.9s;animation-delay:-8.5s;--d:-14px"/><circle class="f" cx="297" cy="-8" r="1.8" opacity="0.26" style="animation-duration:15.1s;animation-delay:-3.6s;--d:-26px"/><circle class="f" cx="490" cy="-8" r="2.6" opacity="0.53" style="animation-duration:9.9s;animation-delay:-1.4s;--d:34px"/><circle class="f" cx="14" cy="-8" r="2.2" opacity="0.47" style="animation-duration:12.3s;animation-delay:-4.4s;--d:-14px"/><circle class="f" cx="667" cy="-8" r="2.6" opacity="0.73" style="animation-duration:8.8s;animation-delay:-5.9s;--d:10px"/><circle class="f" cx="726" cy="-8" r="2.2" opacity="0.34" style="animation-duration:9.2s;animation-delay:-7.0s;--d:-14px"/><circle class="f" cx="625" cy="-8" r="1.2" opacity="0.52" style="animation-duration:18.6s;animation-delay:-5.9s;--d:34px"/><circle class="f" cx="880" cy="-8" r="3.2" opacity="0.43" style="animation-duration:9.7s;animation-delay:-7.4s;--d:-26px"/><circle class="f" cx="941" cy="-8" r="1.8" opacity="0.54" style="animation-duration:16.3s;animation-delay:-15.2s;--d:10px"/><circle class="f" cx="1003" cy="-8" r="1.2" opacity="0.72" style="animation-duration:21.4s;animation-delay:-8.5s;--d:22px"/><circle class="f" cx="1141" cy="-8" r="1.5" opacity="0.75" style="animation-duration:20.3s;animation-delay:-1.8s;--d:-14px"/><circle class="f" cx="167" cy="-8" r="2.2" opacity="0.62" style="animation-duration:17.0s;animation-delay:-10.7s;--d:-26px"/><circle class="f" cx="193" cy="-8" r="2.6" opacity="0.38" style="animation-duration:12.0s;animation-delay:-0.4s;--d:-26px"/><circle class="f" cx="155" cy="-8" r="2.2" opacity="0.52" style="animation-duration:8.8s;animation-delay:-6.4s;--d:10px"/></g>

    <!-- panda, peeking over the near drift -->
    <g class="rise"><g class="peek">
      <circle cx="915" cy="293" r="18" fill="#0A1119" stroke="#6F97B4" stroke-width="2"/>
      <circle cx="1045" cy="293" r="18" fill="#0A1119" stroke="#6F97B4" stroke-width="2"/>
      <ellipse cx="980" cy="304" rx="63" ry="55" fill="#F6FAFC"/>
      <ellipse cx="956" cy="303" rx="12.5" ry="16" fill="#131C26" transform="rotate(22 956 303)"/>
      <ellipse cx="1004" cy="303" rx="12.5" ry="16" fill="#131C26" transform="rotate(-22 1004 303)"/>
      <g class="blink">
        <circle cx="958.5" cy="299" r="2.8" fill="#F6FAFC"/>
        <circle cx="1001.5" cy="299" r="2.8" fill="#F6FAFC"/>
      </g>
      <ellipse cx="980" cy="327" rx="7" ry="4.5" fill="#131C26"/>
      <!-- straw hat -->
      <path d="M880 272 Q980 292 1080 272 L980 208 Z" fill="url(#hat)"/>
      <g fill="none" stroke="#9C7430" stroke-width="1.4" opacity="0.55">
        <path d="M980 208 L912 276"/><path d="M980 208 L946 281"/><path d="M980 208 L980 282"/>
        <path d="M980 208 L1014 281"/><path d="M980 208 L1048 276"/>
        <path d="M930 240 Q980 252 1030 240"/>
      </g>
      <path d="M880 272 Q980 292 1080 272" fill="none" stroke="#9C7430" stroke-width="2.2" opacity="0.7"/>
      <!-- snow settled on the crown -->
      <path d="M980 205 C 962 215, 950 224, 944 233 C 958 229, 966 236, 980 231 C 994 236, 1002 229, 1016 233 C 1010 224, 998 215, 980 205 Z" fill="#EEF4F8"/>
    </g></g>

    <!-- near drift -->
    <path d="M0 346 C 190 322, 400 362, 640 344 S 900 316, 990 320 S 1130 344, 1200 326 V380 H0 Z" fill="url(#drift)"/>

    <g><circle class="f" cx="414" cy="-8" r="2.2" opacity="0.63" style="animation-duration:12.2s;animation-delay:-9.4s;--d:10px"/><circle class="f" cx="909" cy="-8" r="1.5" opacity="0.32" style="animation-duration:11.0s;animation-delay:-11.0s;--d:-26px"/><circle class="f" cx="98" cy="-8" r="2.6" opacity="0.63" style="animation-duration:9.4s;animation-delay:-1.5s;--d:10px"/><circle class="f" cx="487" cy="-8" r="2.2" opacity="0.37" style="animation-duration:18.3s;animation-delay:-9.4s;--d:-14px"/><circle class="f" cx="434" cy="-8" r="2.6" opacity="0.71" style="animation-duration:9.9s;animation-delay:-3.8s;--d:10px"/><circle class="f" cx="612" cy="-8" r="1.8" opacity="0.45" style="animation-duration:13.3s;animation-delay:-3.8s;--d:34px"/><circle class="f" cx="186" cy="-8" r="2.2" opacity="0.73" style="animation-duration:18.6s;animation-delay:-0.7s;--d:10px"/><circle class="f" cx="936" cy="-8" r="3.2" opacity="0.43" style="animation-duration:9.1s;animation-delay:-3.6s;--d:-14px"/><circle class="f" cx="642" cy="-8" r="1.8" opacity="0.79" style="animation-duration:19.9s;animation-delay:-9.8s;--d:22px"/><circle class="f" cx="51" cy="-8" r="1.8" opacity="0.67" style="animation-duration:15.8s;animation-delay:-7.8s;--d:10px"/><circle class="f" cx="712" cy="-8" r="1.8" opacity="0.3" style="animation-duration:21.3s;animation-delay:-5.8s;--d:22px"/><circle class="f" cx="201" cy="-8" r="1.2" opacity="0.63" style="animation-duration:18.6s;animation-delay:-13.7s;--d:10px"/><circle class="f" cx="914" cy="-8" r="1.5" opacity="0.5" style="animation-duration:22.4s;animation-delay:-17.4s;--d:-14px"/><circle class="f" cx="743" cy="-8" r="1.2" opacity="0.78" style="animation-duration:19.4s;animation-delay:-8.2s;--d:22px"/><circle class="f" cx="949" cy="-8" r="2.6" opacity="0.49" style="animation-duration:10.2s;animation-delay:-1.0s;--d:22px"/><circle class="f" cx="243" cy="-8" r="2.6" opacity="0.57" style="animation-duration:16.7s;animation-delay:-2.8s;--d:10px"/><circle class="f" cx="275" cy="-8" r="1.2" opacity="0.34" style="animation-duration:21.5s;animation-delay:-12.9s;--d:34px"/><circle class="f" cx="1108" cy="-8" r="2.2" opacity="0.43" style="animation-duration:17.4s;animation-delay:-6.7s;--d:22px"/><circle class="f" cx="769" cy="-8" r="2.6" opacity="0.46" style="animation-duration:9.8s;animation-delay:-9.8s;--d:10px"/><circle class="f" cx="1023" cy="-8" r="1.8" opacity="0.68" style="animation-duration:14.1s;animation-delay:-1.4s;--d:10px"/></g>

    <text class="up" style="animation-delay:.1s" x="72" y="98" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="3.2" fill="#E0B15A">BCA &#8217;28 &#183; CHRIST UNIVERSITY &#183; BENGALURU</text>
    <text class="up" style="animation-delay:.3s" x="68" y="194" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="88" letter-spacing="-1.5" fill="#EEF4F8"><tspan class="ch" style="animation-delay:0.350s">N</tspan><tspan class="ch" style="animation-delay:0.415s">e</tspan><tspan class="ch" style="animation-delay:0.480s">b</tspan><tspan class="ch" style="animation-delay:0.545s">i</tspan><tspan class="ch" style="animation-delay:0.610s">n</tspan><tspan class="ch" style="animation-delay:0.675s">&#160;</tspan><tspan class="ch" style="animation-delay:0.740s">S</tspan><tspan class="ch" style="animation-delay:0.805s">t</tspan><tspan class="ch" style="animation-delay:0.870s">a</tspan><tspan class="ch" style="animation-delay:0.935s">n</tspan><tspan class="ch" style="animation-delay:1.000s">l</tspan><tspan class="ch" style="animation-delay:1.065s">y</tspan></text>
    <text class="up" style="animation-delay:1.15s" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#B7D5E6">
      <tspan x="72" y="244">Full-stack, IoT and real-time projects,</tspan>
      <tspan x="72" dy="32">taken past the tutorial stage.</tspan>
